name: Bug Report
description: Report a problem with mamori
title: "bug: "
labels: ["bug", "needs-triage"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What went wrong?
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: Command invocation
      description: The exact `mamori` command that triggers the problem.
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened? Include any output.
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: Install method
      options:
        - go install
        - Docker
        - binary release
        - built from source
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: The release tag, image tag, or commit you're running (there's no `-version` flag yet, so check how you installed it).
    validations:
      required: true

  - type: input
    id: os-arch
    attributes:
      label: OS/architecture
      placeholder: e.g. linux/amd64, darwin/arm64
    validations:
      required: false
